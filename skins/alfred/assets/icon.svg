<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Alfred">
  <!-- Alfred's crest — the bow tie on its accent plate, same drawing as the
       predecessor's rail crest: the plate carries a gradient rather than a
       flat accent, which is what keeps it readable on a dark tab strip. The
       shape sits ON the plate rather than in currentColor: a bare stroke on a
       transparent ground vanishes at 16 px. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12a7c0"/>
      <stop offset="1" stop-color="#075463"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#g)"/>
  <path d="M50 53 L27 39 v27 z M50 53 L73 39 v27 z" fill="#ffffff"/>
  <circle cx="50" cy="53" r="7" fill="#ffffff"/>
</svg>
