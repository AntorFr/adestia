<section class="adestia-chat">
<header class="adestia-chat__header">
<span class="adestia-brandname">Corps</span>
<span class="adestia-model-wrap">
<select class="adestia-model adestia-select" aria-label="Model" title="Model">
<option value="">Auto</option>
<option value="m-a">Modèle A</option>
</select>
<svg class="adestia-icon" aria-hidden="true" focusable="false">
<use href="#adestia-i-chevron-down">
</use>
</svg>
</span>
<span class="adestia-chat__spacer">
</span>
<button type="button" class="adestia-ib adestia-btn adestia-btn--icon" aria-label="Conversations" title="Conversations" aria-expanded="true">
<svg class="adestia-icon" aria-hidden="true" focusable="false">
<use href="#adestia-i-list">
</use>
</svg>
</button>
<button type="button" class="adestia-ib adestia-btn adestia-btn--icon" aria-label="New conversation" title="New conversation">
<svg class="adestia-icon" aria-hidden="true" focusable="false">
<use href="#adestia-i-plus">
</use>
</svg>
</button>
<button type="button" class="adestia-ib adestia-btn adestia-btn--icon" aria-label="Open apps" title="Open apps">
<svg class="adestia-icon" aria-hidden="true" focusable="false">
<use href="#adestia-i-panel-right-open">
</use>
</svg>
</button>
</header>
<div class="adestia-tabs" role="tablist">
<div class="adestia-tab" role="tab" aria-selected="false" draggable="true">
<button type="button" class="adestia-tab__pick" title="Fil deux">
<span class="adestia-dot adestia-dot--idle" role="img" aria-label="Idle" title="Idle">
</span>
<span class="adestia-tab__title">Fil deux</span>
</button>
<button type="button" class="adestia-tab__tool adestia-btn adestia-btn--ghost adestia-btn--icon" aria-label="Archive — Fil deux" title="Archive">
<svg class="adestia-icon" aria-hidden="true" focusable="false">
<use href="#adestia-i-archive">
</use>
</svg>
</button>
<button type="button" class="adestia-tab__tool adestia-btn adestia-btn--ghost adestia-btn--icon" aria-label="Close tab — Fil deux" title="Close tab">
<svg class="adestia-icon" aria-hidden="true" focusable="false">
<use href="#adestia-i-x">
</use>
</svg>
</button>
</div>
<div class="adestia-tab adestia-tab--active" role="tab" aria-selected="true" draggable="true">
<button type="button" class="adestia-tab__pick" title="Fil un">
<span class="adestia-dot adestia-dot--idle" role="img" aria-label="Idle" title="Idle">
</span>
<span class="adestia-tab__title">Fil un</span>
</button>
<button type="button" class="adestia-tab__tool adestia-btn adestia-btn--ghost adestia-btn--icon" aria-label="Archive — Fil un" title="Archive">

<use href="#adestia-i-archive">
</use>
</svg>
</button>
<button type="button" class="adestia-tab__tool adestia-btn adestia-btn--ghost adestia-btn--icon" aria-label="Close tab — Fil un" title="Close tab">
<svg class="adestia-icon" aria-hidden="true" focusable="false">
<use href="#adestia-i-x">
</use>
</svg>
</button>
</div>
</div>
<ul class="adestia-conversations">
<li>
<button type="button" class="adestia-conversations__item adestia-conversations__item--current">
<span class="adestia-dot adestia-dot--idle" role="img" aria-label="Idle" title="Idle">
</span>Fil un</button>
<button type="button" class="adestia-conversations__archive adestia-btn adestia-btn--ghost adestia-btn--icon" aria-label="Archive — Fil un" title="Archive">
<svg class="adestia-icon" aria-hidden="true" focusable="false">
<use href="#adestia-i-archive">
</use>
</svg>
</button>
</li>
<li>
<button type="button" class="adestia-conversations__item">
<span class="adestia-dot adestia-dot--idle" role="img" aria-label="Idle" title="Idle">
</span>Fil deux</button>
<button type="button" class="adestia-conversations__archive adestia-btn adestia-btn--ghost adestia-btn--icon" aria-label="Archive — Fil deux" title="Archive">
<svg class="adestia-icon" aria-hidden="true" focusable="false">
<use href="#adestia-i-archive">
</use>
</svg>
</button>
</li>
<li>
<button type="button" class="adestia-conversations__item">
<span class="adestia-dot adestia-dot--idle" role="img" aria-label="Idle" title="Idle">
</span>Fil trois</button>
<button type="button" class="adestia-conversations__archive adestia-btn adestia-btn--ghost adestia-btn--icon" aria-label="Archive — Fil trois" title="Archive">
<svg class="adestia-icon" aria-hidden="true" focusable="false">
<use href="#adestia-i-archive">
</use>
</svg>
</button>
</li>
</ul>
<div class="adestia-chat__conversation">
<article class="adestia-bubble adestia-bubble--user">
<div class="adestia-bubble__text">question c1</div>
</article>
<article class="adestia-bubble adestia-bubble--agent">
<div class="adestia-prose">
<p>
<strong>réponse</strong> c1</p>
</div>
</article>
<div>
</div>
</div>
<form class="adestia-composer">
<input multiple="" hidden="" type="file">
<button type="button" class="adestia-composer__attach adestia-btn adestia-btn--icon" aria-label="Attach files" title="Attach files">
<svg class="adestia-icon" aria-hidden="true" focusable="false">
<use href="#adestia-i-paperclip">
</use>
</svg>
</button>
<button type="button" class="adestia-composer__attach adestia-btn adestia-btn--icon" aria-label="Extra" title="Extra">✦</button>
<textarea class="adestia-composer__input" aria-label="Ask the agent…" placeholder="Ask the agent…" rows="1" style="height: 48px; overflow-y: hidden;">
</textarea>
<button type="submit" class="adestia-composer__send adestia-btn adestia-btn--icon" disabled="" aria-label="Send" title="Send">
<svg class="adestia-icon" aria-hidden="true" focusable="false">
<use href="#adestia-i-arrow-up">
</use>
</svg>
</button>
</form>
</section>
