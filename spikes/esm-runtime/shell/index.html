<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Demeura spike — runtime ESM plugins</title>
<!--
  The import map is the ONLY coupling between shell and plugins for shared
  deps. It must appear before any module script. Bare specifiers in every
  module of the page — including dynamically imported plugin modules and
  their lazy sub-chunks — resolve through it.
-->
<script type="importmap">
{
  "imports": {
    "react": "/vendor/react.js",
    "react-dom/client": "/vendor/react-dom-client.js",
    "react/jsx-runtime": "/vendor/react-jsx-runtime.js"
  }
}
</script>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  #plugin-slot { margin-top: 1rem; }
</style>
</head>
<body>
<h1>Shell</h1>
<div id="status">booting…</div>
<div id="plugin-slot"></div>
<script type="module" src="/boot.js"></script>
</body>
</html>
