<!-- Alfred's mark: the open chevron on its accent plate.
     A favicon is read at 16px on a browser tab, so the shape sits ON the
     plate rather than in currentColor like the in-app crest — a bare stroke
     on a transparent ground vanishes against a dark tab strip. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0e8fa6"/>
  <g fill="#ffffff">
    <path d="M50 53 L27 39 v27 z M50 53 L73 39 v27 z"/>
    <circle cx="50" cy="53" r="7"/>
  </g>
</svg>
