# Adestia — instance configuration
#
# Every setting below is optional: an empty file gives a working single-user
# instance on 127.0.0.1:8730 with no authentication. Unknown keys are refused
# at startup rather than ignored — a typo is a setting you believe is on.

# Loopback by default, deliberately: with `auth.mode: none` there is no gate at
# all. Change this only once something else authenticates your users.
host: 127.0.0.1
port: 8730

# Server-side state: conversations, the attachment inbox, driver secrets (0600).
dataDir: ./data

# What THIS instance is called — the household's, the workshop's.
#
# It names the browser tab and the INSTALL: Adestia is an installable PWA, and
# without this every instance lands on a home screen as an icon called after
# the skin it wears, or "Adestia" under a bare one. Two instances then look like
# the same app. A skin can rename itself, which settles two instances wearing
# two liveries and does nothing for two wearing the same; this wins over it.
#
# It lives in the FILE and has no environment override on purpose: the
# environment says where an instance runs, the file says what it is.
# name: Atelier

# The interface's language: `fr`, `en`. Omit it and the shell asks the
# BROWSER — so a household gets its own language with no configuration, and a
# visitor from elsewhere gets theirs on the same instance. Set it to overrule
# that. A plugin is handed the same value and translates its own words.
# locale: fr

# Named secrets, available to the plugins that DECLARE them (`secrets:` in a
# manifest). A plugin receives only what it named, so the declaration is a
# boundary rather than a comment — and two plugins naming the same key get the
# same value, which is one key to rotate rather than two to keep in step.
#
# Write `${VAR}` so the value stays in the environment: what you commit is the
# wiring. A placeholder whose variable is unset is REFUSED at boot rather than
# handed over as the literal string.
#
# It is also the only channel an instance has for handing a plugin a named
# value, so a setting that is not a credential belongs here when it decides
# what a plugin may REACH — `dev-flow` is told which repositories to scan this
# way, because a list of paths declared in a page would be a file-read
# primitive anything with a pen could re-aim.
# secrets:
#   GOOGLE_MAPS_API_KEY: ${MAPS_KEY}
#   DEV_FLOW_REPOS: /repos/tessera:/repos/ostia

# Concurrent agent turns across all conversations — a refusal (429) at the
# cap, never a silent queue. Measured, not guessed (spikes/concurrency):
# turns genuinely run in parallel and the API was happy at 8, but each CLI
# process costs ~300 MB of RSS and any concurrency adds a one-time ~+1.3 s to
# first-token latency.
#
# Raising this raises the memory the deployment must provide (~300 MB per
# concurrent turn) — see the sizing table in the README, and raise the
# container's memory limit in the SAME change. A generous cap behind a small
# limit is a burst that gets OOM-killed instead of politely refused.
maxConcurrentTurns: 3

auth:
  # none  — single implicit local user. Pair with a loopback bind.
  # proxy — identity from a header set by an authenticating reverse proxy.
  # oidc  — any standard issuer. Adestia never stores passwords or owns accounts.
  mode: none

  # proxy:
  #   userHeader: remote-user
  #   groupsHeader: remote-groups

  # oidc:
  #   issuer: https://auth.example.org
  #   clientId: adestia
  #   clientSecret: ${OIDC_CLIENT_SECRET}
  #   # Must match the client registration EXACTLY. Adestia anchors every URL on
  #   # this value rather than on the incoming request: behind a reverse proxy
  #   # the request carries the container's host, and a redirect built from it
  #   # sends the browser somewhere it cannot reach.
  #   redirectUri: https://adestia.example.org/auth/callback
  #   groupsClaim: groups
  #   allowedGroups: [staff]        # empty means any authenticated user
  #   # Signs session cookies. Omit it and one is generated per boot, which
  #   # signs everyone out on restart — fine for one instance, wrong the moment
  #   # there are two behind a load balancer.
  #   sessionSecret: ${ADESTIA_SESSION_SECRET}
  #   # Audiences to ask for at login, so a turn can act as the person who
  #   # asked — what an MCP server declared `identity: user` requires. Present
  #   # means the login also requests `offline_access`, the refresh token is
  #   # kept per user (in dataDir, 0600), and a fresh access token carrying
  #   # THEIR identity is minted per turn. Absent means Adestia signs people in
  #   # and holds nothing.
  #   #
  #   # ⚠️ Frozen into the grant at login: adding one takes effect at the next
  #   # sign-in, never at a refresh. And the provider's refresh lifetime must
  #   # outlive your session, or the instance looks signed in and reaches
  #   # nothing — set a per-client lifespan if its default is short.
  #   reboundAudience: [https://hub.example]

workspace:
  # The agent's home. Its instructions live here in its CLI's own dialect —
  # Adestia neither normalizes nor translates them.
  root: ./workspace
  pages: pages
  memory: memory
  planif: planif
  # Live refresh. The server watches the pages tree and tells every open shell
  # when a page changed, so what the agent just wrote appears without a reload.
  # Native file events by default; set `polling` when the workspace sits on a
  # mount those events cannot cross — WSL's /mnt/c, NFS, SMB, some Docker bind
  # mounts — at the price of a periodic scan of the tree.
  # watch:
  #   enabled: true
  #   polling: false
  #   intervalMs: 2000

driver:
  # claude-code (Claude Code, via its SDK) or copilot-cli (the `copilot`
  # binary). One engine per instance: instructions live in that CLI's own
  # dialect, and switching later is an assisted migration, not a config flip.
  id: claude-code

  # The binary to run, when the driver spawns one. Worth pinning to an exact
  # path for copilot-cli: it self-updates, so "whatever is on PATH" is not a
  # version anyone can reason about.
  # command: /usr/local/bin/copilot
  # Optional custom agent profile, when supported by the selected driver.
  # agent: reviewer
  # How the instance's OWN tools (rename_conversation, new_id) reach the agent.
  # mcp (default) hands them over as a stdio MCP server. shell is the escape
  # hatch for an org whose CLI validates every MCP server against a corporate
  # registry: ours is unknown, so it is dropped and the agent silently loses
  # its tools. Under shell the driver writes a small CLI and arms the socket
  # and the turn's token in the agent's environment, so the tools ride the
  # ordinary execute tool instead — nothing is declared for the registry to
  # filter. Only copilot-cli honours it; claude-code hosts the tools in its
  # own process and has nothing to escape.
  # Discovery is then YOURS: no engine enumerates these tools any more, so
  # the workspace's instructions (AGENTS.md) must say the CLI exists —
  #   node "$ADESTIA_TOOL_BIN" list
  #   node "$ADESTIA_TOOL_BIN" call rename_conversation '{"title":"…"}'
  # shellToolsTransport: shell
  # Claude's catalogue is per-account and cannot be enumerated offline, so an
  # instance declares what it may use. Omit the list and the model selector
  # hides rather than showing a hardcoded catalogue that lies.
  models:
    - claude-opus-5
    - id: claude-sonnet-5
      label: Sonnet 5

# How much the agent asks before acting. Two postures, no dial in between —
# the in-between (lists of tool names) was removed in 2026-08-26: it judged
# nothing well and a shell one-liner walked around all of it.
permissions:
  # open (default) — nothing is ever asked. What bounds the agent is real:
  #   - this CONTAINER: what is mounted, what is in the env, what the network
  #     reaches — docker-compose.yml, not Adestia code;
  #   - the MCP SERVERS: one that acts on the world (home automation,
  #     messages) carries its own authorization, at the point where the act
  #     lands. Security belongs outside this box;
  #   - your INSTRUCTIONS: tell the agent, in the workspace's instruction
  #     files, what to ask you about in the chat first. A convention it
  #     follows in good faith — honest about being one, never a wall.
  #
  # ⚠️ ask is NOT FINISHED, and is out of the MVP (tried on a real instance
  # 2026-08-26, reverted the same day). It works, but the engine's rule
  # granularity makes it tiring: for `Bash` the CLI proposes a rule on the
  # EXACT command, so every variation asks again, and for a composed command
  # (`cd x && cat <<EOF`) it proposes no rule at all — its parser will not cut
  # the command up. `WebFetch(domain:…)` is what it looks like when it works.
  # Until a person can EDIT the proposed rule (see DESIGN.md, not built yet),
  # expect to click a lot. Use `open` unless you are working on this.
  #
  # ask — the ENGINE's own first line decides, and what it would have asked a
  # terminal about surfaces in the chat instead. Adestia judges nothing and
  # keeps no rules: a `Read` or an `echo` is never asked about (the CLI
  # settles those), and answering "always" hands the engine back its own
  # suggestion, so IT writes the rule into `<workspace>/.claude/settings.local.json`
  # and stops asking — in every thread, after a restart, for good. That file
  # IS your allowlist: open it to see what the agent may do, edit it to take
  # something back. Adestia keeps no list of its own.
  #
  # ⚠️ `ask` needs an engine that can be asked. claude-code can; copilot-cli
  # in programmatic mode has no return channel and auto-denies what it would
  # have asked, so the instance REFUSES TO BOOT rather than turning every
  # question into a silent refusal mid-turn. Pick `open` there, knowingly.
  #
  # A `permissions:` block written for an older Adestia (autoAllow, autoDeny,
  # timeoutMs, whenUnattended) is ignored without error.
  mode: open

# Scheduled turns: markdown notes under workspace/planif/ whose BODY is run
# verbatim as a prompt, on a cadence they declare (`every: 1d`).
#
# OFF by default, deliberately: a note that runs the agent while nobody is
# watching spends a subscription and acts on your workspace. That has to be
# something you turned on, never something you inherited.
#
# A scheduled turn is unattended by definition: under `open` it simply runs,
# and under `ask` every question the engine raises is refused at once — there
# is no screen to show it. Write scheduled prompts accordingly.
schedule:
  enabled: false

# Files dropped into the chat. They land in an inbox OUTSIDE the workspace,
# and the agent reads them with its own tools — so nothing you drag in appears
# in the content it curates until the agent files it there itself.
attachments:
  maxBytes: 26214400   # 25 MB per file
  maxFiles: 8          # per message
  ttlMs: 86400000      # unclaimed files are swept after a day; 0 never sweeps

# Inbound MCP: letting OTHER agents delegate work to this one.
#
# Off by default, and refused without a token — an endpoint other machines can
# reach that runs agent turns is a remote shell, and an instance must never
# grow one because a setting was left blank.
#
# Asynchronous by design: `ask_<agentName>` returns a job id immediately and
# the caller collects the answer with `ask_<agentName>_status`. A delegated
# task takes minutes, and an MCP call held open that long times out somewhere
# between the two agents.
mcp:
  # ── OUTBOUND: what the AGENT may call ───────────────────────────────────
  #
  # The product's canonical surface. An active plugin may bring its own
  # (`mcpServers` in its manifest); on a name conflict THIS block wins, and
  # the plugin that lost is named at startup.
  #
  # The CLI's own MCP config (`.mcp.json`…) stays yours and the agent's:
  # Adestia neither reads it, translates it, nor rewrites it.
  #
  # servers:
  #   - name: home-assistant        # becomes the prefix of the tools exposed
  #     url: https://ha.example/mcp
  #     headers:
  #       Authorization: Bearer ${HA_MCP_TOKEN}
  #   - name: cutlist
  #     command: node
  #     args: ['./bin/cutlist.js']
  #     env:
  #       LANG: fr
  #
  # A hub that validates short-lived OAuth tokens gets an identity instead of
  # a header. Adestia mints and refreshes it, and puts it in `Authorization`
  # once per turn — which is what a token with an hour of life needs, and what
  # a config file cannot do. Do NOT paste a bearer into `headers`: it works
  # for one hour and then quietly stops.
  #
  #   - name: maps
  #     url: https://hub.example/maps
  #     auth:
  #       tokenUrl: https://auth.example/api/oidc/token
  #       clientId: agent-adestia
  #       clientSecret: ${ADESTIA_HUB_SECRET}
  #       scope: mcp
  #       audience: https://hub.example   # a resource server checks this
  #
  # Addons of one hub share an identity: declaring it on each of them costs
  # one token exchange, not one per addon.
  #
  # A public OAuth hub (no client secret) that logs a PERSON in — dynamic
  # client registration + authorization_code + PKCE, as VS Code does — is
  # reached with a `refreshToken` minted once through that interactive flow.
  # Adestia then uses the refresh_token grant per turn and follows a rotated
  # refresh token. Arm the refresh token as a secret; do not commit it.
  #
  #   - name: research
  #     url: https://hub.example/mcp
  #     identity: user
  #     auth:
  #       tokenUrl: https://hub.example/token
  #       clientId: <from dynamic client registration>
  #       refreshToken: ${HUB_REFRESH}
  #       scope: openid
  #
  # A server that serves somebody's OWN data — their calendar, their mail —
  # declares `identity: user` instead. It is then reached with the token of
  # the person who asked, which requires `auth.mode: oidc` and a
  # `reboundAudience` below. A turn with no caller — the clock, an inbound
  # delegation — does not see such a server at all: nothing that runs while
  # you sleep can write in your calendar.
  #
  #   - name: google
  #     url: https://hub.example/google/
  #     identity: user
  #
  # `url` OR `command`, never both — they are two transports. A ${VAR} the
  # environment never filled is REFUSED at startup rather than passed through:
  # a literal "${HA_MCP_TOKEN}" reaching a server fails later, in a call,
  # blaming the server instead of the config.

  # ── INBOUND: the endpoint OTHER agents call here ────────────────────────
  enabled: false
  # token: ${ADESTIA_MCP_TOKEN}
  # Becomes the tool name in the calling agent's list, so name the agent
  # rather than leaving it generic — two connected instances must be
  # distinguishable there.
  agentName: agent
  maxPending: 4
  ttlMs: 3600000

extensions:
  # Where extensions are FOUND. Mount whatever you like here: presence is
  # discovery, never activation.
  pluginsDir: ./plugins
  skinsDir: ./skins

  # What is turned ON, by kind. A plugin absent from these lists ships no code
  # to the browser and mounts no API.
  apps: []       # launcher modules: a tile, a route
  features: []   # shell capabilities: a composer control, a settings entry
  tools: []      # agent capabilities with no interface at all

  # Exactly one skin is active — a value, not a list.
  skin: default
