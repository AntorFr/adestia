<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The scale clamps are half of a fix, not a preference. The shell is a
      fixed `100dvh` with nothing scrollable behind it, so a page zoomed even
      slightly puts the header and its way back to the other screen outside
      the visual viewport with no gesture left to reach them — the interface
      simply looks stuck. Safari honours these once an instance is installed
      to the home screen; in a browser tab it ignores them, and what actually
      keeps the zoom from happening is the 16px floor on every field over in
      `tokens.css`. Both, because neither covers the other's case.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Adestia</title>
    <!-- A skin may replace this; without one the browser still gets an icon
         instead of logging a 404 on every load. -->
    <link rel="icon" href="/icon.svg" />
    <!--
      What makes this installable. The manifest is GENERATED by the server —
      the product's, with the active skin's names and colours merged over it —
      so an instance installs under its own body's name rather than under the
      product's.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      iOS reads this and ignores the manifest's icons entirely. It wants a PNG,
      opaque, 180×180: a vector is not offered to the home screen, and a
      transparent corner comes back black. Served from the active skin when it
      ships one, like the favicon.

      Deliberately NOT accompanied by `apple-mobile-web-app-title`: that tag
      would pin the home-screen name to the product's at build time, while
      the document title a skin sets at runtime is already the name iOS
      proposes — the one thing that tells two instances apart on a phone.
    -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- A manifest carries ONE theme colour; a head tag carries a media query,
         and this product has two palettes. Both name the same `--surface` the
         shell paints, so the browser's own chrome stops at the page instead of
         being visible as a seam above it. -->
    <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <!--
      The import map is the published contract plugins are written against.
      It lives in the shell's HTML, not in a plugin: a map must be parsed
      before the first module resolution, so a plugin can never add its own
      bare names retroactively. Anything not listed here must be vendored by
      the plugin as relative imports.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react.js",
          "react-dom": "/vendor/react-dom.js",
          "react-dom/client": "/vendor/react-dom-client.js",
          "react/jsx-runtime": "/vendor/react-jsx-runtime.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
