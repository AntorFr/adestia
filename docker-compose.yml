# Adestia — a self-hosted instance.
#
# Everything the container needs from outside lives in the three mounts below.
# Copy adestia.config.example.yaml to adestia.config.yaml, adjust, and start.

services:
  adestia:
    build: .
    # image: ghcr.io/antorfr/adestia:latest   # once published
    ports:
      - '127.0.0.1:8730:8730'
    volumes:
      # The agent's home: its instructions, in its CLI's own dialect, and the
      # pages both it and you edit.
      - ./workspace:/workspace
      # Server-side state: conversations, driver credentials.
      - ./data:/data
      # Extensions, dropped in and discovered at startup — no image rebuild.
      - ./plugins:/plugins:ro
      - ./skins:/skins:ro
      - ./adestia.config.yaml:/app/adestia.config.yaml:ro
      # The `dev-flow` plugin reads lot fiches out of repositories that are
      # not the workspace. Read-only, and named to the config by the path the
      # CONTAINER sees — the plugin never writes, and this mount says so twice.
      # - ~/Dev/tessera:/repos/tessera:ro
      # - ~/Dev/ostia:/repos/ostia:ro
    environment:
      # The CLI's own credentials. Which variables matter depends on the
      # configured driver; Adestia can also arm a token from its own UI.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    # Each concurrent turn spawns a CLI process costing ~300 MB (measured, see
    # spikes/concurrency). This limit must agree with `maxConcurrentTurns` in
    # the config: server baseline + N × 300 MB. Below it, the burst is
    # OOM-killed rather than refused — and a kill loses the turn in flight.
    mem_limit: 2g       # server + 3 concurrent turns, with headroom
    restart: unless-stopped
