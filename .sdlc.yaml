# Declaration of this repository to the SDLC chain (homelab-sdlc-core, docs/chaine.md).
# deploiement: the images this repository builds and its application names (vault paths
# apps/<name>, oidc/<name>); the chain deploys them to k8s-home-lab after a release.
deploiement:
  images: [ghcr.io/antorfr/adestia]
  applis: [alfred, dobby, nestor]

# tests: the suite this repository has attested (`attester --publier`, rule R15).
# GitHub Actions plays no suite; the forge only checks the `tests-complets` status.
tests:
  commande: scripts/suite-attestee.sh   # whole suite: ~35 min (34m55s, 3491 tests, same pod)
  rapport: resultats.xml
  format: junit
  delai: 100m
  # The local level: install, typecheck, lint, vitest without the browser/boot files, plugins;
  # no build, guards or boot. ~10 min (10m03s, 2846 tests, same pod), same test names.
  local: scripts/suite-locale.sh
  # The install, played once per extraction by the chain before `rejouer:` and `ecrans:` (AD-ecrans-sans-local-2);
  # a registry failure there is transient. `fiche:`, `commande:` and `local:` install themselves.
  installation: npm ci
  # What decides which screens a branch touches and plays them: the chain reads these paths from
  # origin/main, so a branch cannot lighten its own level (AD-ecrans-sans-local-3).
  outillage: [scripts/niveaux.mjs, scripts/ecrans.json, scripts/suite-ecrans.sh, scripts/suite-locale.sh, scripts/suite-attestee.sh, scripts/suite-rapport.mjs, scripts/rejouer.sh, scripts/rejouer-plan.mjs]
  # Replays the named tests, each with its whole file, from a fresh extraction ({tests}: JUnit names, space-separated, bare or quoted).
  rejouer: scripts/rejouer.sh {tests}
  # The levels between local and the suite (AD-niveaux-1): scripts/niveaux.mjs reads the files
  # changed since {base} and the map scripts/ecrans.json, then plays ONLY the screen
  # tests of the touched screens (ecrans: scripts/suite-ecrans.sh, nothing at all when none is touched) or the suite minus those of untouched screens (fiche).
  # `node scripts/niveaux.mjs --lister ecrans|fiche <base>` prints what each would play; it needs no
  # `npm ci` (the import scanner is the script's own).
  ecrans: node scripts/niveaux.mjs ecrans {base}
  # The screen-test files `ecrans` would play, sorted, one path per line, nothing else (AD-ecrans-liste-1);
  # no install in front: it runs in an extraction without node_modules, and needs the git history of {base}.
  ecrans_liste: node scripts/niveaux.mjs --liste ecrans {base}
  fiche: npm ci && node scripts/niveaux.mjs fiche {base}
