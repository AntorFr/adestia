# Declaration of this repository to the SDLC chain (homelab-sdlc-core, docs/chaine.md).
# deploiement: the images this repository builds and its application names (vault paths
# apps/<name>, oidc/<name>); the chain deploys them to k8s-home-lab after a release.
deploiement:
  images: [ghcr.io/antorfr/adestia]
  applis: [alfred, dobby, nestor]

# tests: the suite this repository has attested (`attester --publier`, rule R15).
# GitHub Actions plays no suite; the forge only checks the `tests-complets` status.
tests:
  commande: scripts/suite-attestee.sh
  rapport: resultats.xml
  format: junit
  delai: 100m
