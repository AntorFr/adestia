<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="maquette.css"><title>Rename a folder (B-35, E-37)</title>
<style>
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.hd h2{margin:0;font:600 18px system-ui,sans-serif;color:var(--text);flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.hd .btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{display:flex;gap:8px;align-items:baseline;padding:8px 12px;margin:0 0 10px;background:color-mix(in srgb,var(--warning) 12%,var(--surface));border-radius:8px;font:14px/1.4 system-ui,sans-serif;color:var(--warning-text,var(--text))}
.note .sp{flex:1}.note u{color:var(--accent-text)}
.sh{background:var(--surface-soft);border:1px solid var(--border);border-radius:12px;padding:14px;font:14px/1.4 system-ui,sans-serif;color:var(--text)}
.sh h3{margin:0 0 6px;font:600 16px system-ui,sans-serif}.sh .par{color:var(--text-faint);font:12px var(--font-mono)}
.sh .f{display:block;margin:6px 0 4px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-sunken)}
.sh .f.bad{border-color:var(--danger-text)}.sh .err{color:var(--danger-text);font-size:13px}
.sh .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.st{font:600 11px var(--font-mono);color:var(--text-faint);margin:12px 0 4px}
</style>
<body><div class="sheetpage"><h1>Rename a folder (B-35, E-37)</h1>
<p class="lead">The Rename control in the E-3 header, the folder-name sheet preset to the last segment (the parent shown above, not editable), its refusals under the field, and the line left when some pages could not be rewritten. Done = the sheet closes and E-3 opens at the new path.</p>
<div class="show" data-tpl="t" data-sets="desk-light desk-dark phone-light phone-dark"></div>
<template id="t"><div class="pg">
<div class="st">E-3 HEADER · folder and its parent writable</div>
<div class="hd"><h2>Voyages 2025</h2><span class="btn" role="button" aria-label="New">+</span><span class="btn" role="button">New from template</span><span class="btn" role="button" aria-label="Rename"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Rename</span></div>
<div class="st">SHEET · preset, Rename disabled while unchanged</div>
<div class="sh"><h3>Rename folder</h3><div class="par">in notes/</div><span class="f">Voyages 2025</span><div class="acts"><span class="btn">Cancel</span><span class="btn" aria-disabled="true" style="opacity:.5">Rename</span></div></div>
<div class="st">SHEET · name taken</div>
<div class="sh"><h3>Rename folder</h3><div class="par">in notes/</div><span class="f bad">Voyages</span><div class="err">name already taken</div><div class="acts"><span class="btn">Cancel</span><span class="btn">Rename</span></div></div>
<div class="st">SHEET · not renamable (the server's reason)</div>
<div class="sh"><h3>Rename folder</h3><div class="par">in /</div><span class="f bad">taches</span><div class="err">this folder is named in the configuration</div><div class="acts"><span class="btn">Cancel</span><span class="btn">Rename</span></div></div>
<div class="st">AFTER · E-3 at the new path, some pages left behind</div>
<div class="hd"><h2>Voyages 2026</h2></div>
<div class="note" role="status"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;align-self:center"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> 2 pages still point to the old name <span class="sp"></span><button class="btn">Details</button><span class="btn">Close</span></div>
</div></template>
</div><script src="maquette.js"></script>
