<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A adestia: a squat figure of clay, stamped on the brow. Deliberately
       simple — a skin replaces it, and an icon nobody can redraw is an icon
       that pins the product to one identity. -->
  <rect width="32" height="32" rx="7" fill="#17161a"/>
  <rect x="9" y="7" width="14" height="12" rx="3" fill="#f0a34a"/>
  <rect x="11" y="20" width="4" height="6" rx="1.5" fill="#f0a34a"/>
  <rect x="17" y="20" width="4" height="6" rx="1.5" fill="#f0a34a"/>
  <circle cx="13" cy="12" r="1.6" fill="#17161a"/>
  <circle cx="19" cy="12" r="1.6" fill="#17161a"/>
  <rect x="13" y="15.5" width="6" height="1.4" rx="0.7" fill="#17161a"/>
</svg>
