<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Skippy">
  <!-- Skippy's crest — the core, reduced to what survives 16 px.
       The full mock-up has 72 graduations and three rings: at favicon size
       they melt into grey mush. So keep the SILHOUETTE — an interrupted amber
       ring, an incandescent heart, on a hull background — and eight thick
       graduations only. Recognisable in a tab, still crisp at 512 px on a
       home screen. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2A93B" stop-opacity=".45"/>
      <stop offset="1" stop-color="#F2A93B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0A0C0F"/>
  <circle cx="50" cy="50" r="30" fill="url(#halo)"/>

  <!-- Graduations: eight, thick, on the cardinal points and the diagonals.
       Any more and they blur into shades of grey. -->
  <g stroke="#B8781E" stroke-width="4" stroke-linecap="round">
    <path d="M50 12 v7 M50 81 v7 M12 50 h7 M81 50 h7"/>
  </g>
  <g stroke="#5C6570" stroke-width="3.5" stroke-linecap="round">
    <path d="M23.2 23.2 l5 5 M71.8 71.8 l5 5 M76.8 23.2 l-5 5 M28.2 71.8 l-5 5"/>
  </g>

  <!-- The amber ring, interrupted: the gesture that says "it is running". -->
  <circle cx="50" cy="50" r="31" fill="none" stroke="#F2A93B" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="120 75" transform="rotate(-40 50 50)"/>
  <!-- The second ring, in steel, quieter and counter-rotating. -->
  <circle cx="50" cy="50" r="21" fill="none" stroke="#D7DEE6" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="46 86" stroke-opacity=".55"
          transform="rotate(150 50 50)"/>

  <!-- The heart. -->
  <circle cx="50" cy="50" r="9.5" fill="#FFD68C"/>
</svg>
