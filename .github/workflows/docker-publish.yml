# Publishes ghcr.io/antorfr/adestia.
#
# Tagging contract (the homelab convention, Renovate-friendly):
#   git tag vX.Y.Z  ->  ghcr.io/antorfr/adestia:X.Y.Z (+ :X.Y :X)
#   manual dispatch ->  the same build, on the ref it is run on
#
# No branch push and no pull request builds anything: the proof that a commit is
# green is its `tests-complets` status (`attester --publier`), checked by the
# `attestation` job before the image is built.
#
# Multi-arch on stable release tags only; everything else builds amd64 alone.
name: docker-publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  statuses: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  attestation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # tests-complets green on this commit, or on a parent of the same tree
      # (a merge commit has the content of the attested head).
      - name: Check the tests-complets attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          arbre=$(git rev-parse 'HEAD^{tree}')
          for c in $(git rev-list --parents -n 1 HEAD); do
            [ "$(git rev-parse "$c^{tree}")" = "$arbre" ] || continue
            st=$(gh api "repos/$GITHUB_REPOSITORY/commits/$c/status" \
              --jq '.statuses[] | select(.context == "tests-complets") | .state + " " + .description' | head -1)
            [ "${st%% *}" = success ] && { echo "Attestation sur $c : ${st#* }"; exit 0; }
          done
          echo "::error::Pas d'attestation tests-complets sur ce contenu : attester --publier, puis relancer."
          exit 1

  build:
    needs: attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          # What the instance answers when asked which version it is. Taken
          # from the metadata step rather than from `github.ref` so the string
          # on screen is the tag that was actually pushed — `0.32.0` for a
          # release, `main` for the dev image.
          build-args: |
            ADESTIA_VERSION=${{ steps.meta.outputs.version }}
          platforms: >-
            ${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
                && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
