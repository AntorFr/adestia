# Golem — instance configuration
#
# Every setting below is optional: an empty file gives a working single-user
# instance on 127.0.0.1:8730 with no authentication. Unknown keys are refused
# at startup rather than ignored — a typo is a setting you believe is on.

# Loopback by default, deliberately: with `auth.mode: none` there is no gate at
# all. Change this only once something else authenticates your users.
host: 127.0.0.1
port: 8730

# Server-side state: conversations, the attachment inbox, driver secrets (0600).
dataDir: ./data

# The interface's language: `fr`, `en`. Omit it and the shell asks the
# BROWSER — so a household gets its own language with no configuration, and a
# visitor from elsewhere gets theirs on the same instance. Set it to overrule
# that. A plugin is handed the same value and translates its own words.
# locale: fr

# Named secrets, available to the plugins that DECLARE them (`secrets:` in a
# manifest). A plugin receives only what it named, so the declaration is a
# boundary rather than a comment — and two plugins naming the same key get the
# same value, which is one key to rotate rather than two to keep in step.
#
# Write `${VAR}` so the value stays in the environment: what you commit is the
# wiring. A placeholder whose variable is unset is REFUSED at boot rather than
# handed over as the literal string.
# secrets:
#   GOOGLE_MAPS_API_KEY: ${MAPS_KEY}

# Concurrent agent turns across all conversations — a refusal (429) at the
# cap, never a silent queue. Measured, not guessed (spikes/concurrency):
# turns genuinely run in parallel and the API was happy at 8, but each CLI
# process costs ~300 MB of RSS and any concurrency adds a one-time ~+1.3 s to
# first-token latency.
#
# Raising this raises the memory the deployment must provide (~300 MB per
# concurrent turn) — see the sizing table in the README, and raise the
# container's memory limit in the SAME change. A generous cap behind a small
# limit is a burst that gets OOM-killed instead of politely refused.
maxConcurrentTurns: 3

auth:
  # none  — single implicit local user. Pair with a loopback bind.
  # proxy — identity from a header set by an authenticating reverse proxy.
  # oidc  — any standard issuer. Golem never stores passwords or owns accounts.
  mode: none

  # proxy:
  #   userHeader: remote-user
  #   groupsHeader: remote-groups

  # oidc:
  #   issuer: https://auth.example.org
  #   clientId: golem
  #   clientSecret: ${OIDC_CLIENT_SECRET}
  #   # Must match the client registration EXACTLY. Golem anchors every URL on
  #   # this value rather than on the incoming request: behind a reverse proxy
  #   # the request carries the container's host, and a redirect built from it
  #   # sends the browser somewhere it cannot reach.
  #   redirectUri: https://golem.example.org/auth/callback
  #   groupsClaim: groups
  #   allowedGroups: [staff]        # empty means any authenticated user
  #   # Signs session cookies. Omit it and one is generated per boot, which
  #   # signs everyone out on restart — fine for one instance, wrong the moment
  #   # there are two behind a load balancer.
  #   sessionSecret: ${GOLEM_SESSION_SECRET}

workspace:
  # The agent's home. Its instructions live here in its CLI's own dialect —
  # Golem neither normalizes nor translates them.
  root: ./workspace
  pages: pages
  memory: memory
  planif: planif

driver:
  # claude-code (Claude Code, via its SDK) or copilot-cli (the `copilot`
  # binary). One engine per instance: instructions live in that CLI's own
  # dialect, and switching later is an assisted migration, not a config flip.
  id: claude-code

  # The binary to run, when the driver spawns one. Worth pinning to an exact
  # path for copilot-cli: it self-updates, so "whatever is on PATH" is not a
  # version anyone can reason about.
  # command: /usr/local/bin/copilot
  # Claude's catalogue is per-account and cannot be enumerated offline, so an
  # instance declares what it may use. Omit the list and the model selector
  # hides rather than showing a hardcoded catalogue that lies.
  models:
    - claude-opus-5
    - id: claude-sonnet-5
      label: Sonnet 5

# When the agent must ask before using a tool, and what happens when nobody
# answers. Asking for everything and refusing on silence is the default: an
# agent that proceeds because nobody was watching did something nobody
# approved, and unlike a stalled turn, that is not recoverable.
permissions:
  # Tools that never ask. Matched EXACTLY — a prefix rule allowing "Read"
  # would also allow a "ReadSecrets" tool arriving in a future CLI version.
  #
  # Two zones stay guarded whatever you put here, because their rules are
  # consulted BEFORE this list: the scheduled-notes folder (whose bodies are
  # prompts) and the driver's authority paths — its permission file, its
  # hooks, its MCP wiring. A turn may not change what a turn is allowed to do.
  #
  # ⚠️ ONE EXCEPTION, and it is the reason to think twice before adding
  # "Bash" here. Those guards inspect FILE EDITS. A shell command that
  # rewrites the same file (`sed -i`, a redirect) is not a file edit anything
  # can inspect, so it follows this list alone: auto-allowing Bash reopens
  # what they close, and no content rule can shut it again. The instance says
  # so out loud at startup when you do.
  autoAllow: []
  autoDeny: []
  # How long a request waits for a person, in milliseconds.
  timeoutMs: 300000
  # Applied on timeout, and immediately when no interface is watching at all
  # (a scheduled turn, a delegated one).
  whenUnattended: deny

# Scheduled turns: markdown notes under workspace/planif/ whose BODY is run
# verbatim as a prompt, on a cadence they declare (`every: 1d`).
#
# OFF by default, deliberately: a note that runs the agent while nobody is
# watching spends a subscription and acts on your workspace. That has to be
# something you turned on, never something you inherited.
#
# A scheduled turn is unattended by definition, so every permission it raises
# is decided by `permissions.whenUnattended` above.
schedule:
  enabled: false

# Files dropped into the chat. They land in an inbox OUTSIDE the workspace,
# and the agent reads them with its own tools — so nothing you drag in appears
# in the content it curates until the agent files it there itself.
attachments:
  maxBytes: 26214400   # 25 MB per file
  maxFiles: 8          # per message
  ttlMs: 86400000      # unclaimed files are swept after a day; 0 never sweeps

# Inbound MCP: letting OTHER agents delegate work to this one.
#
# Off by default, and refused without a token — an endpoint other machines can
# reach that runs agent turns is a remote shell, and an instance must never
# grow one because a setting was left blank.
#
# Asynchronous by design: `ask_<agentName>` returns a job id immediately and
# the caller collects the answer with `ask_<agentName>_status`. A delegated
# task takes minutes, and an MCP call held open that long times out somewhere
# between the two agents.
mcp:
  # ── OUTBOUND: what the AGENT may call ───────────────────────────────────
  #
  # The product's canonical surface. An active plugin may bring its own
  # (`mcpServers` in its manifest); on a name conflict THIS block wins, and
  # the plugin that lost is named at startup.
  #
  # The CLI's own MCP config (`.mcp.json`…) stays yours and the agent's:
  # Golem neither reads it, translates it, nor rewrites it.
  #
  # servers:
  #   - name: home-assistant        # becomes the prefix of the tools exposed
  #     url: https://ha.example/mcp
  #     headers:
  #       Authorization: Bearer ${HA_MCP_TOKEN}
  #   - name: cutlist
  #     command: node
  #     args: ['./bin/cutlist.js']
  #     env:
  #       LANG: fr
  #
  # A hub that validates short-lived OAuth tokens gets an identity instead of
  # a header. Golem mints and refreshes it, and puts it in `Authorization`
  # once per turn — which is what a token with an hour of life needs, and what
  # a config file cannot do. Do NOT paste a bearer into `headers`: it works
  # for one hour and then quietly stops.
  #
  #   - name: maps
  #     url: https://hub.example/maps
  #     auth:
  #       tokenUrl: https://auth.example/api/oidc/token
  #       clientId: agent-golem
  #       clientSecret: ${GOLEM_HUB_SECRET}
  #       scope: mcp
  #       audience: https://hub.example   # a resource server checks this
  #
  # Addons of one hub share an identity: declaring it on each of them costs
  # one token exchange, not one per addon.
  #
  # `url` OR `command`, never both — they are two transports. A ${VAR} the
  # environment never filled is REFUSED at startup rather than passed through:
  # a literal "${HA_MCP_TOKEN}" reaching a server fails later, in a call,
  # blaming the server instead of the config.

  # ── INBOUND: the endpoint OTHER agents call here ────────────────────────
  enabled: false
  # token: ${GOLEM_MCP_TOKEN}
  # Becomes the tool name in the calling agent's list, so name the agent
  # rather than leaving it generic — two connected instances must be
  # distinguishable there.
  agentName: agent
  maxPending: 4
  ttlMs: 3600000

extensions:
  # Where extensions are FOUND. Mount whatever you like here: presence is
  # discovery, never activation.
  pluginsDir: ./plugins
  skinsDir: ./skins

  # What is turned ON, by kind. A plugin absent from these lists ships no code
  # to the browser and mounts no API.
  apps: []       # launcher modules: a tile, a route
  features: []   # shell capabilities: a composer control, a settings entry
  tools: []      # agent capabilities with no interface at all

  # Exactly one skin is active — a value, not a list.
  skin: default
